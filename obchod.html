<head>
  <meta charset="UTF-8">

  <title>NOXIFY | Oficiální Item Shop</title>

  <style>
    :root {
      --bg-dark: #050914;
      --card-bg: rgba(13, 22, 45, 0.75);
      --mc-blue: #38b6ff;
      --mc-blue-glow: rgba(56, 182, 255, 0.4);
      --mc-cyan: #55ffff;
      --mc-red: #ff5555;
      --mc-yellow: #ffaa00;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: rgba(56, 182, 255, 0.2);
      --font-pixel: 'VT323', monospace;
      --font-ui: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-ui);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(56, 182, 255, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(0, 85, 255, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(5, 9, 20, 0.85);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-link { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-img { height: 45px; width: auto; object-fit: contain; filter: drop-shadow(0 0 8px var(--mc-blue-glow)); }
    .logo-text { font-size: 1.5rem; font-weight: 800; color: var(--text-main); }
    .nav-links { display: flex; gap: 20px; list-style: none; }
    .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .nav-links a.active, .nav-links a:hover { color: var(--mc-blue); }

    .header-actions { display: flex; align-items: center; gap: 12px; }
    .support-btn, .review-btn, .cart-btn {
      background: rgba(56, 182, 255, 0.1);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .support-btn:hover, .review-btn:hover, .cart-btn:hover { border-color: var(--mc-blue); box-shadow: 0 0 15px var(--mc-blue-glow); color: var(--mc-blue); }
    .cart-count { background: var(--mc-blue); color: #050914; font-weight: 800; font-size: 0.85rem; padding: 2px 7px; border-radius: 50%; }

    .hero { text-align: center; padding: 70px 20px 40px; max-width: 800px; margin: 0 auto; }
    .hero-badge { display: inline-block; background: rgba(56, 182, 255, 0.1); border: 1px solid var(--mc-blue); color: var(--mc-blue); font-family: var(--font-pixel); font-size: 1.3rem; padding: 4px 14px; border-radius: 4px; margin-bottom: 15px; }
    .hero h1 { font-size: 3rem; font-weight: 800; margin-bottom: 15px; }
    .hero h1 span { color: var(--mc-blue); text-shadow: 0 0 20px var(--mc-blue-glow); }
    .hero p { color: var(--text-muted); font-size: 1.1rem; }

    .controls-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
    .filters-search-wrapper { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; flex-grow: 1; }
    .filter-tags { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .filter-btn:hover, .filter-btn.active { background: rgba(56, 182, 255, 0.2); border-color: var(--mc-blue); color: var(--mc-blue); }
